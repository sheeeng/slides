version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
  - package-ecosystem: npm
    directories:
      - "/slides/demystifying-the-nix-store"
      - "/slides/governing-azure-resources-with-policy"
      - "/slides/reproducible-environments-docker-vs-nix"
      - "/slides/running-kernel-based-virtual-machine"
      - "/slides/tracking-nixpkgs-merged-pull-requests"
    schedule:
      interval: "daily"
    groups:
      deps:
        dependency-type: "production"
        patterns:
          - "*"
      deps-dev:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - dependencies
    versioning-strategy: increase
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      nix:
        patterns:
          - "*"
    labels:
      - "dependencies"
