on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0" # At 00:00 on Sunday.
  workflow_dispatch:
permissions: {}
concurrency:
  group: "deploy-pages"
  cancel-in-progress: true
jobs:
  build-slides:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slide:
          - name: demystifying-the-nix-store
          - name: governing-azure-resources-with-policy
          - name: reproducible-environments-docker-vs-nix
          - name: running-kernel-based-virtual-machine
          - name: tracking-nixpkgs-merged-pull-requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - name: Install Dependencies
        working-directory: slides/${{ matrix.slide.name }}
        run: npm ci
      - name: Build Slides
        working-directory: slides/${{ matrix.slide.name }}
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: slides-${{ matrix.slide.name }}
          path: slides/${{ matrix.slide.name }}/public
  deploy:
    needs: [build-slides]
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            index.html
            talks.toml
            favicon.ico
            favicon-16x16.png
            favicon-32x32.png
            apple-touch-icon.png
            android-chrome-192x192.png
            android-chrome-512x512.png
            site.webmanifest
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slides-demystifying-the-nix-store
          path: public/demystifying-the-nix-store
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slides-governing-azure-resources-with-policy
          path: public/governing-azure-resources-with-policy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slides-reproducible-environments-docker-vs-nix
          path: public/reproducible-environments-docker-vs-nix
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slides-running-kernel-based-virtual-machine
          path: public/running-kernel-based-virtual-machine
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slides-tracking-nixpkgs-merged-pull-requests
          path: public/tracking-nixpkgs-merged-pull-requests
      - name: Prepare Public Directory
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |-
          mkdir --parents public
          BUILD_SHA="${GITHUB_SHA:0:8}"
          sed \
            --expression "s/YOUR_GOOGLE_MAPS_API_KEY/${GOOGLE_MAPS_API_KEY}/g" \
            --expression "s/__BUILD_REVISION__/${GITHUB_SHA}/g" \
            --expression "s/__BUILD_SHA__/${BUILD_SHA}/g" \
            index.html > public/index.html
          cp talks.toml public/talks.toml
          cp favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png \
             android-chrome-192x192.png android-chrome-512x512.png site.webmanifest public/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public/
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
