<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leonard's Slides</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #fafbfc;
        --bg-card: #ffffff;
        --text: #1f2328;
        --text-muted: #656d76;
        --link: #0969da;
        --border: #d0d7de;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --bg-card: #161b22;
          --text: #e6edf3;
          --text-muted: #8b949e;
          --link: #58a6ff;
          --border: #30363d;
        }
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: clamp(2rem, 6vw, 4rem) clamp(1rem, 4vw, 2rem);
      }

      header {
        display: flex;
        align-items: center;
        gap: clamp(0.75rem, 2vw, 1rem);
        margin-bottom: clamp(2rem, 5vw, 3rem);
      }

      header img {
        width: clamp(40px, 8vw, 56px);
        height: clamp(40px, 8vw, 56px);
      }

      h1 {
        font-size: clamp(1.25rem, 3.5vw, 1.75rem);
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: clamp(0.5rem, 1.5vw, 0.75rem);
      }

      li a {
        display: flex;
        align-items: center;
        gap: clamp(0.75rem, 2vw, 1rem);
        padding: clamp(0.75rem, 2vw, 1rem);
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-card);
        color: var(--link);
        text-decoration: none;
        font-size: clamp(0.95rem, 2vw, 1.0625rem);
        font-weight: 500;
        transition: border-color 0.15s ease;
      }

      li a:hover {
        border-color: var(--link);
      }

      li a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }

      li a picture {
        flex-shrink: 0;
        line-height: 0;
      }

      li a picture img {
        display: block;
        width: clamp(24px, 5vw, 32px);
        height: clamp(24px, 5vw, 32px);
      }

      /* Map section */
      #talks-map {
        margin-bottom: clamp(1.5rem, 4vw, 2rem);
      }

      .map-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .map-header h2 {
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .map-toggle {
        display: flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }

      .map-btn {
        padding: 0.375rem 0.875rem;
        font-size: 0.875rem;
        font-weight: 500;
        font-family: inherit;
        background: var(--bg-card);
        color: var(--text-muted);
        border: none;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }

      .map-btn:not(:last-child) {
        border-right: 1px solid var(--border);
      }

      .map-btn.active {
        background: var(--link);
        color: #ffffff;
      }

      .map-btn:hover:not(.active) {
        background: var(--bg);
        color: var(--text);
      }

      .map-btn:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: -2px;
      }

      .map-container {
        height: 420px;
        border-radius: 8px;
        border: 1px solid var(--border);
        overflow: hidden;
      }

      .map-container[hidden] {
        display: none;
      }

      .map-error {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        font-size: 0.9rem;
        padding: 1rem;
        text-align: center;
      }

      #map-stats {
        margin-bottom: 0.75rem;
        font-size: 0.875rem;
      }

      .stats-summary {
        font-weight: 600;
        margin-bottom: 0.375rem;
      }

      .stats-continents {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
      }

      .stats-continent-label {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-muted);
      }

      .stats-countries {
        list-style: none;
        color: var(--text-muted);
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
        padding-left: 0.75rem;
        margin-top: 0.125rem;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>

  <body>
    <main>
      <header>
        <img src="https://sheeeng.github.io/logo.png" alt="Leonard" />
        <h1>Leonard's Slides</h1>
      </header>
      <section id="talks-map">
        <div class="map-header">
          <h2>Where I've Spoken</h2>
          <div class="map-toggle" role="group" aria-label="Map provider">
            <button id="btn-gmaps" class="map-btn active" aria-pressed="true">
              Google Maps
            </button>
            <button id="btn-osm" class="map-btn" aria-pressed="false">
              OpenStreetMap
            </button>
          </div>
        </div>
        <div id="map-stats" aria-live="polite"></div>
        <div id="map-google" class="map-container"></div>
        <div id="map-osm" class="map-container" hidden></div>
      </section>
      <ul>
        <li>
          <a href="demystifying-the-nix-store/">
            <picture>
              <source
                srcset="
                  https://fonts.gstatic.com/s/e/notoemoji/latest/2744_fe0f/512.webp
                "
                type="image/webp"
              />
              <img
                src="https://fonts.gstatic.com/s/e/notoemoji/latest/2744_fe0f/512.gif"
                alt="Snowflake"
                width="32"
                height="32"
              />
            </picture>
            Demystifying the Nix Store
          </a>
        </li>
        <li>
          <a href="governing-azure-resources-with-policy/">
            <img
              src="https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/512/emoji_u1f3db.png"
              alt="Classical Building"
              width="32"
              height="32"
            />
            Governing Azure Resources with Policy
          </a>
        </li>
        <li>
          <a href="running-kernel-based-virtual-machine/">
            <img
              src="https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/512/emoji_u1f5a5.png"
              alt="Desktop Computer"
              width="32"
              height="32"
            />
            Running Kernel-based Virtual Machine
          </a>
        </li>
        <li>
          <a href="tracking-nixpkgs-merged-pull-requests/">
            <picture>
              <source
                srcset="
                  https://fonts.gstatic.com/s/e/notoemoji/latest/2744_fe0f/512.webp
                "
                type="image/webp"
              />
              <img
                src="https://fonts.gstatic.com/s/e/notoemoji/latest/2744_fe0f/512.gif"
                alt="Snowflake"
                width="32"
                height="32"
              />
            </picture>
            Tracking Nixpkgs Merged Pull Requests
          </a>
        </li>
      </ul>
    </main>

    <script type="module">
      // Replace with your Google Maps JavaScript API key.
      // Restrict it to your domain in Google Cloud Console.
      const GOOGLE_MAPS_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY";

      function parseTOML(text) {
        const result = {};
        let current = null;
        for (const raw of text.split("\n")) {
          const line = raw.trim();
          if (!line || line.startsWith("#")) continue;
          const arr = line.match(/^\[\[(\w+)\]\]$/);
          if (arr) {
            const key = arr[1];
            if (!result[key]) result[key] = [];
            current = {};
            result[key].push(current);
            continue;
          }
          if (current) {
            const eq = line.indexOf("=");
            if (eq === -1) continue;
            const k = line.slice(0, eq).trim();
            let v = line.slice(eq + 1).trim();
            if (v.startsWith('"') && v.endsWith('"')) v = v.slice(1, -1);
            else if (v === "true") v = true;
            else if (v === "false") v = false;
            else if (v !== "" && !isNaN(v)) v = parseFloat(v);
            current[k] = v;
          }
        }
        return result;
      }

      const VALID_CONTINENTS = new Set([
        "Africa",
        "Antarctica",
        "Asia",
        "Europe",
        "North America",
        "Oceania",
        "South America",
      ]);

      async function loadTalks() {
        const res = await fetch("talks.toml");
        if (!res.ok) return [];
        const talks = parseTOML(await res.text()).talk ?? [];
        for (const t of talks) {
          if (!t.continent) {
            console.warn(`talks.toml: missing continent for "${t.title}"`);
          } else if (!VALID_CONTINENTS.has(t.continent)) {
            console.warn(`talks.toml: unknown continent "${t.continent}" for "${t.title}" — valid values: ${[...VALID_CONTINENTS].join(", ")}`);
          }
        }
        return talks;
      }

      function formatDate(d) {
        if (!d) return "";
        if (/^\d{4}$/.test(d)) return d;
        const [y, m, day] = d.split("-").map(Number);
        return new Date(y, m - 1, day).toLocaleDateString("en-US", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      function popupHTML(talk) {
        const title = talk.url
          ? `<a href="${talk.url}" target="_blank" rel="noopener">${talk.title}</a>`
          : talk.title;
        const meta = [talk.city && talk.country ? `${talk.city}, ${talk.country}` : "", formatDate(talk.date)]
          .filter(Boolean)
          .join(" • ");
        return (
          `<div style="font-family:inherit;line-height:1.6;padding:2px 4px">` +
          `<strong>${title}</strong>` +
          (talk.event ? `<br>${talk.event}` : "") +
          (meta ? `<br><span style="color:#777">${meta}</span>` : "") +
          `</div>`
        );
      }

      function renderStats(talks) {
        const byContinent = {};
        for (const t of talks) {
          const c = t.continent ?? "Unknown";
          if (!byContinent[c]) byContinent[c] = {};
          if (!byContinent[c][t.country]) byContinent[c][t.country] = new Set();
          byContinent[c][t.country].add(t.city);
        }
        const totalContinents = Object.keys(byContinent).length;
        const totalCountries = Object.values(byContinent).reduce((n, countries) => n + Object.keys(countries).length, 0);
        const totalCities = Object.values(byContinent).reduce((n, countries) =>
          n + Object.values(countries).reduce((m, cities) => m + cities.size, 0), 0);
        const pl = (n, singular, plural = singular + "s") => `${n} ${n === 1 ? singular : plural}`;
        const continentRows = Object.entries(byContinent)
          .sort(([a], [b]) => a.localeCompare(b))
          .map(([continent, countries]) => {
            const countryRows = Object.entries(countries)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([country, cities]) => `<li>${country} • ${[...cities].sort().join(", ")}</li>`)
              .join("");
            return `<li><span class="stats-continent-label">${continent}</span><ul class="stats-countries">${countryRows}</ul></li>`;
          })
          .join("");
        document.getElementById("map-stats").innerHTML =
          `<p class="stats-summary">${pl(talks.length, "talk")} · ${pl(totalContinents, "continent")} · ${pl(totalCountries, "country", "countries")} · ${pl(totalCities, "city", "cities")}</p>` +
          `<ul class="stats-continents">${continentRows}</ul>`;
      }

      // Google Maps
      let gmapsMap = null;

      async function initGoogleMaps(talks) {
        const el = document.getElementById("map-google");
        if (gmapsMap) return;

        if (GOOGLE_MAPS_API_KEY.startsWith("YOUR_")) {
          el.innerHTML =
            '<p class="map-error">Set your Google Maps API key in index.html to enable this map.</p>';
          return;
        }

        if (!window.google?.maps) {
          await new Promise((resolve, reject) => {
            window.__gmapsReady = resolve;
            const s = document.createElement("script");
            s.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=__gmapsReady&loading=async`;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }

        const bounds = new google.maps.LatLngBounds();
        gmapsMap = new google.maps.Map(el, {
          zoom: 4,
          center: { lat: 50, lng: 10 },
        });

        const infoWindow = new google.maps.InfoWindow();
        for (const talk of talks) {
          const pos = { lat: talk.lat, lng: talk.lng };
          const marker = new google.maps.Marker({
            position: pos,
            map: gmapsMap,
            title: talk.title,
          });
          marker.addListener("click", () => {
            infoWindow.setContent(popupHTML(talk));
            infoWindow.open(gmapsMap, marker);
          });
          bounds.extend(pos);
        }
        if (talks.length) gmapsMap.fitBounds(bounds);
      }

      // Leaflet / OpenStreetMap
      let leafletMap = null;

      async function initLeaflet(talks) {
        const el = document.getElementById("map-osm");
        if (!window.L) {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "https://unpkg.com/leaflet@1/dist/leaflet.css";
          document.head.appendChild(link);
          await new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = "https://unpkg.com/leaflet@1/dist/leaflet.js";
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }

        if (leafletMap) {
          leafletMap.invalidateSize();
          return;
        }

        leafletMap = L.map(el).setView([50, 10], 4);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution:
            '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxZoom: 18,
        }).addTo(leafletMap);

        const bounds = [];
        for (const talk of talks) {
          L.marker([talk.lat, talk.lng])
            .addTo(leafletMap)
            .bindPopup(popupHTML(talk));
          bounds.push([talk.lat, talk.lng]);
        }
        if (bounds.length)
          leafletMap.fitBounds(bounds, { padding: [40, 40] });
      }

      // Toggle
      const btnGmaps = document.getElementById("btn-gmaps");
      const btnOsm = document.getElementById("btn-osm");
      const mapGoogle = document.getElementById("map-google");
      const mapOsm = document.getElementById("map-osm");

      btnGmaps.addEventListener("click", () => {
        if (btnGmaps.classList.contains("active")) return;
        btnGmaps.classList.add("active");
        btnGmaps.setAttribute("aria-pressed", "true");
        btnOsm.classList.remove("active");
        btnOsm.setAttribute("aria-pressed", "false");
        mapOsm.hidden = true;
        mapGoogle.hidden = false;
        initGoogleMaps(talks);
      });

      btnOsm.addEventListener("click", async () => {
        if (btnOsm.classList.contains("active")) return;
        btnOsm.classList.add("active");
        btnOsm.setAttribute("aria-pressed", "true");
        btnGmaps.classList.remove("active");
        btnGmaps.setAttribute("aria-pressed", "false");
        mapGoogle.hidden = true;
        mapOsm.hidden = false;
        await initLeaflet(talks);
        leafletMap.invalidateSize();
      });

      const talks = await loadTalks();
      renderStats(talks);
      await initGoogleMaps(talks);
    </script>
  </body>
</html>
