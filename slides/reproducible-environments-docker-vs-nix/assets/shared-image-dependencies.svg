<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title description">
  <title id="title">Shared Runtime Dependencies</title>
  <desc id="description">A simplified dependency graph. The Nginx image depends on Nginx, and the GNU Hello image depends on GNU Hello. The presenter verified the identical glibc store path in both x86_64 Linux runtime closures. Layer sharing has not been verified. Arrows point toward dependencies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#526579"/></marker>
  </defs>
  <rect width="1120" height="400" rx="8" fill="#f5f7fa"/>
  <g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 280 104 V 152"/>
    <path d="M 840 104 V 152"/>
    <path d="M 280 216 V 240 Q 280 248 288 248 H 512 Q 520 248 520 256 V 288"/>
    <path d="M 840 216 V 240 Q 840 248 832 248 H 608 Q 600 248 600 256 V 288"/>
  </g>
  <g fill="#ffffff" stroke="#526579" stroke-width="2">
    <rect x="120" y="40" width="320" height="64" rx="8"/>
    <rect x="680" y="40" width="320" height="64" rx="8"/>
    <rect x="120" y="152" width="320" height="64" rx="8"/>
    <rect x="680" y="152" width="320" height="64" rx="8"/>
  </g>
  <rect x="400" y="288" width="320" height="64" rx="8" fill="#e0edf7" stroke="#376c96" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#243547">
    <text x="280" y="80">Nginx Image</text>
    <text x="840" y="80">GNU Hello Image</text>
    <text x="280" y="192">Nginx</text>
    <text x="840" y="192">GNU Hello</text>
    <text x="560" y="328">Shared glibc</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#526579">
    <text x="560" y="24">Simplified graph: shared glibc verified on x86_64 Linux</text>
    <text x="560" y="384">Matching glibc store paths verified. Identical image layers require a separate check.</text>
  </g>
</svg>
